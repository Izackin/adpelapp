<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Sem conexão | ADPEL</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #020617;
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 32px 24px;
      text-align: center;
      background: #0f172a;
      border: 1px solid #1e3a8a;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    img { width: 96px; height: 96px; object-fit: contain; }
    h1 { margin: 20px 0 10px; font-size: 1.5rem; }
    p { margin: 0; color: #94a3b8; line-height: 1.6; }
    button {
      min-height: 44px;
      margin-top: 24px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="images/icon-192.png" alt="ADPEL">
    <h1>Você está sem conexão</h1>
    <p>Alguns recursos da ADPEL precisam de internet. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
