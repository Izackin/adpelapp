<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ADPEL Harpa">
  <title>Harpa Cristã | ADPEL</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
    .hymn-index-row { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; border-radius: 0.5rem; transition: all 0.15s; border: 1px solid transparent; background: rgba(15,23,42,0.4); cursor: pointer; text-align: left; width: 100%; }
    .hymn-index-row:hover { background: rgba(30,41,59,0.6); border-color: rgba(217,119,6,0.25); }
    .hymn-index-num { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: #f59e0b; min-width: 2.2rem; text-align: right; }
    .hymn-index-title { flex: 1; font-size: 0.95rem; font-weight: 500; color: #f1f5f9; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .coro-box { background: rgba(217,119,6,0.10); border-left: 3px solid rgba(217,119,6,0.5); border-radius: 0 0.75rem 0.75rem 0; padding: 1.25rem 1.5rem; margin: 1.5rem 0; }
    mark { background: rgba(217,119,6,0.35); color: #fef3c7; border-radius: 0.25rem; padding: 0 0.25rem; }

    .hymn-sheet { width: 100%; max-width: 100%; margin: 0 auto; background: rgba(15,23,42,0.45); border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; padding: 2rem 1.5rem; --font-scale: 1; }
    .hymn-header { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1.75rem; margin-bottom: 2.25rem; }
    .hymn-number { font-family: 'Playfair Display', serif; font-size: calc(3rem * var(--font-scale)); line-height: 1; color: #f59e0b; opacity: 0.85; margin-bottom: 0.25rem; }
    .hymn-title { font-family: 'Playfair Display', serif; font-size: calc(1.6rem * var(--font-scale)); line-height: 1.3; color: #f8fafc; font-weight: 700; }
    .stanza { margin-bottom: 2.2rem; }
    .stanza-number { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: rgba(217,119,6,0.18); color: #fbbf24; font-size: 0.7rem; font-weight: 800; margin-right: 0.6rem; font-family: 'Inter', sans-serif; flex-shrink: 0; }
    .stanza-body { display: flex; align-items: flex-start; gap: 0.5rem; }
    .stanza-text { font-family: 'Playfair Display', serif; font-size: calc(1.15rem * var(--font-scale)); line-height: 2; color: #e2e8f0; white-space: pre-line; }
    .chorus-label { font-size: calc(0.7rem * var(--font-scale)); letter-spacing: 0.18em; text-transform: uppercase; color: #fbbf24; font-weight: 700; margin-bottom: 0.35rem; }
    .chorus-text { font-family: 'Playfair Display', serif; font-size: calc(1.15rem * var(--font-scale)); line-height: 2; color: #fde68a; font-style: italic; white-space: pre-line; }
    .empty-hymn { text-align: center; color: #94a3b8; font-style: italic; margin-top: 2rem; }
    .error-hymn { text-align: center; color: #f87171; margin-top: 2rem; }

    @media (min-width: 768px) {
      .hymn-sheet { padding: 2.5rem 3rem; }
    }
    @media (min-width: 1024px) {
      .hymn-sheet { padding: 3rem 4rem; }
      .stanza-text, .chorus-text { font-size: calc(1.25rem * var(--font-scale)); line-height: 2.1; }
    }
    @media (max-width: 640px) {
      .stanza-text, .chorus-text { font-size: calc(1.05rem * var(--font-scale)); line-height: 1.95; }
      .hymn-number { font-size: calc(2.2rem * var(--font-scale)); }
      .hymn-title { font-size: calc(1.3rem * var(--font-scale)); }
      .hymn-sheet { padding: 1.5rem 1.25rem; }
    }

    /* Leitura contínua e favoritos da Harpa */
    .hymn-index-item { display: flex; align-items: stretch; gap: .5rem; min-width: 0; }
    .hymn-index-row { flex: 1; min-width: 0; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    .harpa-star-button { display: inline-flex; align-items: center; justify-content: center; width: 2.85rem; min-width: 2.85rem; min-height: 2.85rem; border-radius: .65rem; color: #94a3b8; border: 1px solid rgba(148,163,184,.24); background: rgba(15,23,42,.75); transition: color .15s, border-color .15s, background .15s; cursor: pointer; }
    .harpa-star-button:hover, .harpa-star-button.is-favorite { color: #fbbf24; border-color: rgba(251,191,36,.48); background: rgba(217,119,6,.12); }
    .harpa-star-button:focus-visible, .hymn-index-row:focus-visible, .harpa-hymn-nav button:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
    .harpa-filter-button { padding: .55rem .9rem; border-radius: .65rem; color: #94a3b8; background: rgba(30,41,59,.6); border: 1px solid rgba(148,163,184,.14); font-size: .85rem; font-weight: 600; cursor: pointer; }
    .harpa-filter-button.is-active { color: #fef3c7; border-color: rgba(251,191,36,.5); background: rgba(217,119,6,.18); }
    .harpa-hymn-nav { display: flex; align-items: center; justify-content: space-between; gap: .65rem; margin: 1rem 0 1.8rem; }
    .harpa-hymn-nav button { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.85rem; padding: .65rem .85rem; border-radius: .7rem; border: 1px solid rgba(251,191,36,.35); background: rgba(217,119,6,.12); color: #fcd34d; font-size: .85rem; font-weight: 650; cursor: pointer; }
    .harpa-hymn-nav button:hover:not(:disabled) { background: rgba(217,119,6,.22); }
    .harpa-hymn-nav button:disabled { opacity: .35; cursor: not-allowed; }
    .harpa-hymn-position { color: #94a3b8; font-size: .8rem; text-align: center; }
    @media (max-width: 380px) {
      .harpa-hymn-nav button { padding: .6rem; font-size: .76rem; }
      .harpa-hymn-position { font-size: .72rem; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col" data-app-context="word">

  <header class="bg-[#0f172a]/90 backdrop-blur border-b border-gray-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button type="button" onclick="harpaPageBack()" class="text-gray-400 hover:text-white transition p-2 -ml-2" aria-label="Voltar à lista da Harpa ou à Palavra"><i class="fas fa-arrow-left" aria-hidden="true"></i></button>
      <h1 class="font-bold text-lg text-white tracking-wide">ADPEL <span class="text-yellow-500 font-serif">Harpa Cristã</span></h1>
    </div>
  </header>

  <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full flex flex-col gap-6">
    <div id="harpa-search-panel" class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-[#0f172a]/60 p-5 rounded-xl border border-white/10 backdrop-blur-sm">
      <div class="relative flex-1">
        <i class="fas fa-search absolute left-3 top-2.5 text-gray-500 text-xs"></i>
        <input type="text" id="harpa-search" placeholder="Buscar por número, título ou trecho..." class="pl-8 pr-3 py-2 bg-[#0f172a] border border-gray-700 rounded-lg text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-yellow-500 outline-none w-full" onkeydown="if(event.key==='Enter')searchHymns()">
      </div>
      <button onclick="searchHymns()" class="px-3 py-2 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg text-sm transition"><i class="fas fa-search"></i></button>
    </div>

    <div id="harpa-list-controls" class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex gap-2" role="group" aria-label="Filtrar hinos">
        <button type="button" id="harpa-filter-all" class="harpa-filter-button is-active" aria-pressed="true" onclick="setHarpFilter('all')"><i class="fas fa-list mr-1" aria-hidden="true"></i> Todos</button>
        <button type="button" id="harpa-filter-favorites" class="harpa-filter-button" aria-pressed="false" onclick="setHarpFilter('favorites')"><i class="fas fa-star mr-1" aria-hidden="true"></i> Favoritos <span id="harpa-favorites-count">(0)</span></button>
      </div>
      <span class="text-xs text-gray-400">Segure um hino para favoritar.</span>
    </div>
    <div id="harpa-favorite-feedback" role="status" aria-live="polite" class="text-xs text-yellow-400 min-h-0"></div>

    <div id="harpa-loading" class="hidden flex flex-col items-center justify-center py-12">
      <div class="w-10 h-10 border-4 border-yellow-700 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-yellow-500 text-sm font-medium">Carregando hinos...</p>
    </div>

    <div id="harpa-empty" class="hidden flex flex-col items-center justify-center py-12">
      <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-music text-2xl text-gray-500"></i>
      </div>
      <p class="text-gray-400 font-medium mb-1">Nenhum hino encontrado</p>
      <p id="harpa-empty-desc" class="text-sm text-gray-500">Tente buscar por número, título ou trecho do hino.</p>
    </div>

    <div id="harpa-list-view" class="flex-1 flex flex-col gap-2">
      <div id="harpa-results" class="grid grid-cols-1 gap-2"></div>
    </div>

    <div id="harpa-detail-view" class="hidden flex-1 flex flex-col overflow-y-auto animate-fade-in">
      <div class="hymn-sheet py-6 px-4 md:px-8">
        <div class="flex items-center justify-between mb-6">
          <button onclick="backToList()" class="text-sm text-yellow-500 hover:text-yellow-400 flex items-center gap-2 w-fit transition font-medium">
            <i class="fas fa-arrow-left"></i> Voltar à lista
          </button>
          <div class="flex items-center gap-2">
            <button id="harpa-detail-favorite" type="button" onclick="toggleCurrentHymnFavorite()" class="harpa-star-button" aria-label="Adicionar hino aos favoritos" aria-pressed="false" title="Favoritar hino"><i class="far fa-star" aria-hidden="true"></i></button>
            <button onclick="ajustarFonte(-0.1)" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-500 border border-gray-700 flex items-center justify-center transition text-xs font-bold" title="Diminuir fonte">A-</button>
            <button onclick="ajustarFonte(0.1)" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-500 border border-gray-700 flex items-center justify-center transition text-lg font-bold leading-none" title="Aumentar fonte">A+</button>
          </div>
        </div>

        <div class="hymn-header text-center">
          <div class="hymn-number mb-2" id="harpa-detail-number"></div>
          <h2 class="hymn-title" id="harpa-detail-title"></h2>
        </div>

        <nav class="harpa-hymn-nav" aria-label="Navegação entre hinos">
          <button type="button" id="harpa-prev-top" onclick="changeHymn(-1)" aria-label="Hino anterior"><i class="fas fa-chevron-left" aria-hidden="true"></i> Anterior</button>
          <span id="harpa-hymn-position" class="harpa-hymn-position"></span>
          <button type="button" id="harpa-next-top" onclick="changeHymn(1)" aria-label="Próximo hino">Próximo <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        </nav>

        <div id="harpa-detail-coro" class="coro-box p-4 md:p-5 mb-6 hidden"></div>

        <div id="harpa-detail-verses"></div>
        <nav class="harpa-hymn-nav" aria-label="Navegação entre hinos no fim da leitura">
          <button type="button" id="harpa-prev-bottom" onclick="changeHymn(-1)" aria-label="Hino anterior"><i class="fas fa-chevron-left" aria-hidden="true"></i> Anterior</button>
          <button type="button" id="harpa-next-bottom" onclick="changeHymn(1)" aria-label="Próximo hino">Próximo <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        </nav>
      </div>
    </div>
  </main>

  <nav id="mobile-nav" aria-label="Navegação principal"></nav>

  <script>
    const HARPA_URL = 'https://piqlrjzlepcpqootpyvq.supabase.co/storage/v1/object/public/harpa/harpa.json';
    const CACHE_KEY = 'harpaCache_v5';
    const CACHE_TIME_KEY = 'harpaCacheTime_v5';
    const CACHE_TTL = 24 * 60 * 60 * 1000;

    let allHymns = [];
    let escalaFonteHino = 1;
    const HARPA_FAVORITES_KEY = 'adpelHarpaFavorites_v1';
    let harpFavorites = new Set();
    let harpFilter = 'all';
    let currentHymnId = null;
    let harpListScrollY = 0;
    let hasListHistoryEntry = false;
    let pressTimer = null;
    let pressData = null;
    let suppressClickId = null;
    let suppressClickUntil = 0;

    function ajustarFonte(delta) {
      escalaFonteHino = Math.max(0.8, Math.min(1.5, escalaFonteHino + delta));
      const sheet = document.querySelector('.hymn-sheet');
      if (sheet) sheet.style.setProperty('--font-scale', escalaFonteHino);
    }

    function escapeHtml(value) {
      if (value == null) return '';
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function sanitizeHymnText(text) {
      if (text == null) return '';
      let str = String(text);
      // Remove artefatos de dados corrompidos/concatenados
      str = str.replace(/undefinednull/gi, '');
      str = str.replace(/\bundefined\b/gi, '');
      str = str.replace(/\bnull\b/gi, '');
      // Converte <br>, <br/>, <br /> (case insensitive) em quebras reais
      str = str.replace(/<br\s*\/?>/gi, '\n');
      // Limpa quebras excessivas
      str = str.replace(/\n{3,}/g, '\n\n').trim();
      return str;
    }

    function showLoading(show) {
      const el = document.getElementById('harpa-loading');
      if (el) el.classList.toggle('hidden', !show);
      const list = document.getElementById('harpa-list-view');
      if (list) list.classList.toggle('hidden', show);
    }

    function showEmpty(show) {
      const el = document.getElementById('harpa-empty');
      if (el) el.classList.toggle('hidden', !show);
      const results = document.getElementById('harpa-results');
      if (results) results.classList.toggle('hidden', show);
    }

    function normalizarHino(raw, id) {
      const hino = { id: String(id || ''), hino: '', coro: '', verses: {} };
      if (raw == null) return hino;

      if (typeof raw === 'string') {
        hino.verses['1'] = raw;
        return hino;
      }

      const titulo = raw.hino || raw.titulo || raw.title || raw.nome || raw.name || raw.hymn || raw.song || raw.hymn_title || raw.song_title || '';
      hino.hino = sanitizeHymnText(typeof titulo === 'string' ? titulo : String(titulo));

      const coro = raw.coro || raw.chorus || raw.refrão || raw.refrain || raw.chorus_text || raw.coro_texto || raw.refrain_text || '';
      hino.coro = sanitizeHymnText(typeof coro === 'string' ? coro : String(coro));

      let rawVerses = raw.verses || raw.estrofes || raw.stanzas || raw.versos || raw.lyrics || raw.texto || raw.text || raw.body || raw.content || null;

      if (rawVerses) {
        if (typeof rawVerses === 'string') {
          const clean = sanitizeHymnText(rawVerses);
          const parts = clean.split(/\n\s*\n/).filter(Boolean);
          if (parts.length > 1) {
            parts.forEach((p, i) => { hino.verses[String(i + 1)] = p.trim(); });
          } else {
            hino.verses['1'] = clean;
          }
        } else if (Array.isArray(rawVerses)) {
          rawVerses.forEach((v, i) => {
            const num = String(i + 1);
            if (typeof v === 'string') {
              hino.verses[num] = sanitizeHymnText(v);
            } else if (v && typeof v === 'object') {
              const txt = v.text || v.verse || v.content || v.lyric || v.string || v.verso || v.body || JSON.stringify(v);
              hino.verses[String(v.number || v.id || num)] = sanitizeHymnText(String(txt));
            }
          });
        } else if (typeof rawVerses === 'object') {
          Object.entries(rawVerses).forEach(([k, v]) => {
            if (typeof v === 'string') {
              hino.verses[k] = sanitizeHymnText(v);
            } else if (v && typeof v === 'object') {
              hino.verses[k] = sanitizeHymnText(v.text || v.verse || v.content || v.lyric || v.string || v.verso || v.body || JSON.stringify(v));
            }
          });
        }
      }

      if (Object.keys(hino.verses).length === 0) {
        Object.keys(raw).forEach(key => {
          if (/^\d+$/.test(key)) {
            const val = raw[key];
            if (typeof val === 'string') {
              hino.verses[key] = sanitizeHymnText(val);
            } else if (val && typeof val === 'object') {
              hino.verses[key] = sanitizeHymnText(val.text || val.verse || val.content || val.lyric || val.string || val.verso || val.body || JSON.stringify(val));
            }
          }
        });
      }

      if (Object.keys(hino.verses).length === 0 && hino.hino && hino.hino.includes('\n')) {
        hino.verses['1'] = hino.hino;
        hino.hino = '';
      }

      // Última limpeza de segurança em todos os versos
      Object.keys(hino.verses).forEach(k => {
        hino.verses[k] = sanitizeHymnText(hino.verses[k]);
      });

      return hino;
    }

    async function carregarHarpa() {
      try {
        let hinos = [];
        const cache = localStorage.getItem(CACHE_KEY);
        const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
        const agora = Date.now();

        if (cache && cacheTime && (agora - Number(cacheTime) < CACHE_TTL)) {
          console.log('[Harpa] Usando cache local');
          hinos = JSON.parse(cache);
        } else {
          console.log('[Harpa] Baixando do Storage...');
          const response = await fetch(HARPA_URL);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();

          console.log('[Harpa] Tipo do JSON:', Array.isArray(data) ? 'array' : typeof data);
          if (!Array.isArray(data) && typeof data === 'object') {
            console.log('[Harpa] Primeiras chaves:', Object.keys(data).slice(0, 10));
          }

          let entries = [];
          if (Array.isArray(data)) {
            entries = data.map((item, idx) => [String(idx + 1), item]);
          } else if (data && typeof data === 'object') {
            entries = Object.entries(data).filter(([key]) => key !== '-1' && key !== 'meta');
          }

          hinos = entries.map(([id, raw]) => normalizarHino(raw, id)).filter(h => {
            const temTitulo = (h.hino || '').trim().length > 0;
            const temVersos = Object.keys(h.verses).length > 0;
            return temTitulo || temVersos;
          });

          console.log('[Harpa] Hinos carregados:', hinos.length);
          if (hinos.length > 0) {
            console.log('[Harpa] Exemplo do primeiro hino:', hinos[0]);
          }

          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(hinos));
            localStorage.setItem(CACHE_TIME_KEY, String(agora));
          } catch (e) {
            console.warn('[Harpa] Cache localStorage falhou:', e);
          }
        }

        return hinos;
      } catch (error) {
        console.error('[Harpa] Erro ao carregar:', error);
        return [];
      }
    }

    function truncate(str, n) {
      if (!str) return '';
      return str.length > n ? str.substring(0, n - 1) + '...' : str;
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }


    function loadHarpFavorites() {
      try {
        const values = JSON.parse(localStorage.getItem(HARPA_FAVORITES_KEY) || '[]');
        harpFavorites = new Set(Array.isArray(values) ? values.map(String) : []);
      } catch (error) {
        console.warn('[Harpa] Não foi possível ler os favoritos:', error);
        harpFavorites = new Set();
      }
    }

    function persistHarpFavorites() {
      try {
        localStorage.setItem(HARPA_FAVORITES_KEY, JSON.stringify([...harpFavorites]));
      } catch (error) {
        console.warn('[Harpa] Não foi possível salvar os favoritos:', error);
      }
    }

    function isHarpFavorite(id) {
      return harpFavorites.has(String(id));
    }

    function updateHarpFilterButtons() {
      for (const mode of ['all', 'favorites']) {
        const button = document.getElementById('harpa-filter-' + mode);
        if (!button) continue;
        const active = harpFilter === mode;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      }
      const count = document.getElementById('harpa-favorites-count');
      if (count) count.textContent = '(' + allHymns.filter(h => isHarpFavorite(h.id)).length + ')';
    }

    function renderHymnList(list, highlightTerm) {
      const container = document.getElementById('harpa-results');
      if (!container) return;
      updateHarpFilterButtons();
      const visible = harpFilter === 'favorites'
        ? (list || []).filter(h => isHarpFavorite(h.id))
        : (list || []);
      if (!visible.length) {
        container.innerHTML = '';
        const empty = document.getElementById('harpa-empty-desc');
        if (empty) empty.textContent = harpFilter === 'favorites'
          ? 'Nenhum favorito encontrado. Segure um hino na lista Todos ou toque na estrela para favoritar.'
          : 'Tente buscar por número, título ou trecho do hino.';
        showEmpty(true);
        return;
      }

      showEmpty(false);
      container.innerHTML = visible.map(h => {
        const titulo = sanitizeHymnText(h.hino || 'Hino sem título').trim();
        let titleHtml = escapeHtml(titulo);
        if (highlightTerm) {
          const re = new RegExp('(' + escapeRegExp(highlightTerm) + ')', 'gi');
          titleHtml = titleHtml.replace(re, '<mark>$1</mark>');
        }
        const id = escapeHtml(h.id);
        const favorite = isHarpFavorite(h.id);
        const favoriteLabel = (favorite ? 'Remover hino ' : 'Favoritar hino ') + id;
        return '<div class="hymn-index-item">' +
          '<button type="button" class="hymn-index-row" data-hymn-id="' + id + '" aria-label="Abrir hino ' + id + ': ' + escapeHtml(titulo) + '">' +
            '<span class="hymn-index-num">' + id + '</span>' +
            '<span class="hymn-index-title">' + titleHtml + '</span>' +
            '<i class="fas fa-chevron-right text-gray-500 text-xs ml-2" aria-hidden="true"></i>' +
          '</button>' +
          '<button type="button" class="harpa-star-button' + (favorite ? ' is-favorite' : '') +
            '" data-favorite-id="' + id + '" aria-pressed="' + String(favorite) + '" aria-label="' + favoriteLabel + '" title="' + favoriteLabel + '">' +
            '<i class="' + (favorite ? 'fas' : 'far') + ' fa-star" aria-hidden="true"></i>' +
          '</button></div>';
      }).join('');
    }

    function refreshHarpList() {
      const input = document.getElementById('harpa-search');
      const term = input ? input.value.trim() : '';
      renderHymnList(buscarHinos(allHymns, term), term);
    }

    function setHarpFilter(mode) {
      if (mode !== 'all' && mode !== 'favorites') return;
      harpFilter = mode;
      refreshHarpList();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function updateDetailFavorite() {
      const button = document.getElementById('harpa-detail-favorite');
      if (!button || !currentHymnId) return;
      const favorite = isHarpFavorite(currentHymnId);
      const label = (favorite ? 'Remover hino ' : 'Favoritar hino ') + currentHymnId;
      button.classList.toggle('is-favorite', favorite);
      button.setAttribute('aria-pressed', String(favorite));
      button.setAttribute('aria-label', label);
      button.title = label;
      button.innerHTML = '<i class="' + (favorite ? 'fas' : 'far') + ' fa-star" aria-hidden="true"></i>';
    }

    function toggleHarpFavorite(id) {
      id = String(id);
      if (!allHymns.some(h => h.id === id)) return;
      if (harpFavorites.has(id)) harpFavorites.delete(id);
      else harpFavorites.add(id);
      persistHarpFavorites();
      refreshHarpList();
      updateDetailFavorite();
      const feedback = document.getElementById('harpa-favorite-feedback');
      if (feedback) feedback.textContent = 'Hino ' + id + (harpFavorites.has(id) ? ' adicionado aos favoritos.' : ' removido dos favoritos.');
    }

    function toggleCurrentHymnFavorite() {
      if (currentHymnId) toggleHarpFavorite(currentHymnId);
    }

    function updateHarpNavigation() {
      if (!currentHymnId) return;
      const index = allHymns.findIndex(h => h.id === currentHymnId);
      const prevDisabled = index <= 0;
      const nextDisabled = index < 0 || index >= allHymns.length - 1;
      ['harpa-prev-top', 'harpa-prev-bottom'].forEach(id => {
        const button = document.getElementById(id);
        if (button) button.disabled = prevDisabled;
      });
      ['harpa-next-top', 'harpa-next-bottom'].forEach(id => {
        const button = document.getElementById(id);
        if (button) button.disabled = nextDisabled;
      });
      const position = document.getElementById('harpa-hymn-position');
      if (position) position.textContent = 'Hino ' + currentHymnId;
      updateDetailFavorite();
    }

    function changeHymn(direction) {
      if (!currentHymnId) return;
      const index = allHymns.findIndex(h => h.id === currentHymnId);
      const next = allHymns[index + (direction < 0 ? -1 : 1)];
      if (index < 0 || !next) return;
      // A troca pelas setas não empilha entradas: Voltar retorna à lista.
      openHymn(next.id, { historyMode: 'replace' });
    }


    function buscarHinos(hinos, busca) {
      busca = busca.toLowerCase().trim();
      if (!busca) return hinos;
      return hinos.filter(item => {
        const versos = Object.values(item.verses || {}).join(' ').toLowerCase();
        return (
          item.id === busca ||
          (item.hino && item.hino.toLowerCase().includes(busca)) ||
          versos.includes(busca) ||
          (item.coro && item.coro.toLowerCase().includes(busca))
        );
      });
    }


    function searchHymns() {
      const input = document.getElementById('harpa-search');
      const term = input ? input.value.trim() : '';
      const results = buscarHinos(allHymns, term);
      renderHymnList(results, term);
      const visible = harpFilter === 'favorites' ? results.filter(h => isHarpFavorite(h.id)) : results;
      if (/^\d+$/.test(term) && visible.length === 1) openHymn(visible[0].id);
    }


    function openHymn(id, options) {
      id = String(id);
      const historyMode = options && options.historyMode ? options.historyMode : 'push';
      const hymn = allHymns.find(h => h.id === id);
      if (!hymn) {
        console.warn('Hino não encontrado para id:', id);
        const detailView = document.getElementById('harpa-detail-view');
        const versesBox = document.getElementById('harpa-detail-verses');
        if (detailView) detailView.classList.remove('hidden');
        const listView = document.getElementById('harpa-list-view');
        if (listView) listView.classList.add('hidden');
        if (versesBox) versesBox.innerHTML = '<p class="error-hymn">Não foi possível abrir o hino ' + escapeHtml(id) + '.<br>Tente recarregar a página.</p>';
        return;
      }

      if (!currentHymnId) harpListScrollY = window.scrollY;
      currentHymnId = id;

      if (historyMode === 'push') {
        history.pushState({ harpaView: 'detail', id: id }, '', '#hino=' + encodeURIComponent(id));
        hasListHistoryEntry = true;
      } else if (historyMode === 'replace') {
        history.replaceState({ harpaView: 'detail', id: id }, '', '#hino=' + encodeURIComponent(id));
      }

      const listView = document.getElementById('harpa-list-view');
      const detailView = document.getElementById('harpa-detail-view');
      const searchPanel = document.getElementById('harpa-search-panel');
      const controls = document.getElementById('harpa-list-controls');
      const feedback = document.getElementById('harpa-favorite-feedback');
      if (listView) listView.classList.add('hidden');
      if (searchPanel) searchPanel.classList.add('hidden');
      if (controls) controls.classList.add('hidden');
      if (feedback) feedback.classList.add('hidden');
      if (detailView) detailView.classList.remove('hidden');
      updateHarpNavigation();
      window.scrollTo({ top: 0, behavior: 'auto' });

      const numEl = document.getElementById('harpa-detail-number');
      const titleEl = document.getElementById('harpa-detail-title');
      const coroBox = document.getElementById('harpa-detail-coro');
      const versesBox = document.getElementById('harpa-detail-verses');

      const tituloSeguro = sanitizeHymnText(hymn.hino || 'Hino sem título').trim();
      const coroSeguro = sanitizeHymnText(hymn.coro || '').trim();

      if (numEl) numEl.textContent = String(hymn.id || '');
      if (titleEl) titleEl.textContent = tituloSeguro;
      if (window.ADPELJourney && typeof window.ADPELJourney.registerHymnOpened === 'function') {
        window.ADPELJourney.registerHymnOpened();
      }

      if (coroBox) {
        if (coroSeguro) {
          coroBox.classList.remove('hidden');
          coroBox.innerHTML = '<div class="chorus-label">Coro</div><div class="chorus-text">' + escapeHtml(coroSeguro) + '</div>';
        } else {
          coroBox.classList.add('hidden');
          coroBox.innerHTML = '';
        }
      }

      if (versesBox) {
        const chaves = Object.keys(hymn.verses || {});
        if (chaves.length > 0) {
          const entradas = chaves
            .map(function(k) { return [k, sanitizeHymnText(String(hymn.verses[k] || '')).trim()]; })
            .filter(function(item) { return item[1].length > 0; })
            .sort(function(a, b) {
              var na = parseInt(a[0], 10);
              var nb = parseInt(b[0], 10);
              return (isNaN(na) ? 9999 : na) - (isNaN(nb) ? 9999 : nb);
            });

          versesBox.innerHTML = entradas.map(function(item) {
            return '<div class="stanza"><div class="stanza-body"><span class="stanza-number">' + item[0] + '</span><div class="stanza-text">' + escapeHtml(item[1]) + '</div></div></div>';
          }).join('');
        } else {
          versesBox.innerHTML = '<p class="empty-hymn">Nenhum verso disponível para este hino.</p>';
        }
      }
    }


    function showHarpList() {
      currentHymnId = null;
      const listView = document.getElementById('harpa-list-view');
      const detailView = document.getElementById('harpa-detail-view');
      const searchPanel = document.getElementById('harpa-search-panel');
      const controls = document.getElementById('harpa-list-controls');
      const feedback = document.getElementById('harpa-favorite-feedback');
      if (listView) listView.classList.remove('hidden');
      if (detailView) detailView.classList.add('hidden');
      if (searchPanel) searchPanel.classList.remove('hidden');
      if (controls) controls.classList.remove('hidden');
      if (feedback) feedback.classList.remove('hidden');
      // Mantém a pesquisa e devolve o leitor ao ponto anterior na lista.
      requestAnimationFrame(() => {
        window.scrollTo({ top: harpListScrollY, behavior: 'auto' });
      });
    }

    function backToList() {
      if (!currentHymnId) return;
      if (hasListHistoryEntry) {
        hasListHistoryEntry = false;
        history.back();
      } else {
        history.replaceState({ harpaView: 'list' }, '', location.pathname + location.search);
        showHarpList();
      }
    }

    function harpaPageBack() {
      if (currentHymnId) {
        backToList();
      } else {
        window.location.assign('index.html#word');
      }
    }

    function handleHarpPopstate() {
      const match = location.hash.match(/^#hino=([^&]+)/);
      let id = null;
      if (match) {
        try { id = decodeURIComponent(match[1]); } catch (error) { id = null; }
      }
      if (id && allHymns.some(h => h.id === id)) {
        openHymn(id, { historyMode: 'none' });
      } else {
        hasListHistoryEntry = false;
        showHarpList();
      }
    }

    function initHarpListInteractions() {
      const results = document.getElementById('harpa-results');
      if (!results) return;
      const cancelLongPress = () => {
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = null;
        pressData = null;
      };

      results.addEventListener('click', event => {
        const star = event.target.closest('[data-favorite-id]');
        if (star) {
          toggleHarpFavorite(star.dataset.favoriteId);
          return;
        }
        const row = event.target.closest('[data-hymn-id]');
        if (!row) return;
        const id = row.dataset.hymnId;
        if (suppressClickId === id && Date.now() < suppressClickUntil) {
          suppressClickId = null;
          event.preventDefault();
          return;
        }
        suppressClickId = null;
        openHymn(id);
      });

      results.addEventListener('pointerdown', event => {
        const row = event.target.closest('[data-hymn-id]');
        if (!row || event.button !== 0) return;
        cancelLongPress();
        pressData = { id: row.dataset.hymnId, pointerId: event.pointerId, x: event.clientX, y: event.clientY };
        pressTimer = setTimeout(() => {
          if (!pressData) return;
          const id = pressData.id;
          suppressClickId = id;
          suppressClickUntil = Date.now() + 900;
          cancelLongPress();
          toggleHarpFavorite(id);
        }, 550);
      });

      results.addEventListener('pointermove', event => {
        if (!pressData || event.pointerId !== pressData.pointerId) return;
        if (Math.hypot(event.clientX - pressData.x, event.clientY - pressData.y) > 12) cancelLongPress();
      });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
        results.addEventListener(type, cancelLongPress);
      });
      results.addEventListener('contextmenu', event => {
        if (event.target.closest('[data-hymn-id]')) event.preventDefault();
      });

      document.addEventListener('keydown', event => {
        if (!currentHymnId || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target && event.target.closest('input, textarea, [contenteditable="true"]')) return;
        if (event.key === 'ArrowLeft') changeHymn(-1);
        if (event.key === 'ArrowRight') changeHymn(1);
      });
    }

    document.addEventListener('DOMContentLoaded', async function() {
      loadHarpFavorites();
      initHarpListInteractions();
      window.addEventListener('popstate', handleHarpPopstate);
      showLoading(true);
      allHymns = (await carregarHarpa()).sort((a, b) =>
        String(a.id).localeCompare(String(b.id), 'pt-BR', { numeric: true })
      );
      showLoading(false);
      refreshHarpList();
      if (location.hash.startsWith('#hino=')) handleHarpPopstate();
    });


  </script>
