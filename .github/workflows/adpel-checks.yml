name: ADPEL - verificacoes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Executar testes JavaScript
        run: node --test tests/*.test.js tests/*.test.mjs
