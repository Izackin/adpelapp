<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ADPEL Bíblia">
  <title>Bíblia ADPEL 2.0</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js?v=bible-2.0"></script>
  <script src="spiritual-progress.js?v=bible-2.0"></script>
  <script src="js/bible.js?v=bible-2.0" defer></script>
  <link rel="stylesheet" href="bible.css">
  <style>
    body { font-family: Inter, sans-serif; background: #020617; color: #e2e8f0; }
    .pergaminho { background: #fffaf0; border: 1px solid #dfd3bc; color: #24170f; font-family: 'Playfair Display', serif; }
    .chapter-btn { min-width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .5rem; border: 1px solid rgba(255,255,255,.12); background: rgba(30,41,59,.8); color: #e2e8f0; font-size: .8rem; font-weight: 700; }
    .chapter-btn.active { border-color: #2563eb; background: #2563eb; color: white; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <header class="sticky top-0 z-40 flex items-center justify-between border-b border-slate-800 bg-slate-900/95 px-4 py-3 backdrop-blur">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10" aria-label="Voltar para início"><i class="fas fa-arrow-left"></i></a>
      <div><h1 class="font-bold text-white">Bíblia ADPEL</h1><p class="text-xs text-amber-400">Leitura e estudo pessoal</p></div>
    </div>
    <button onclick="toggleFullscreen()" class="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10" aria-label="Alternar tela cheia"><i class="fas fa-expand"></i></button>
  </header>

  <main id="bible-reader" class="mx-auto flex min-h-[calc(100vh-68px)] w-full max-w-6xl flex-col gap-4 p-3 md:p-6">
    <section class="flex flex-col gap-3 rounded-2xl border border-white/10 bg-slate-900/75 p-3 shadow-xl md:p-4">
      <div class="flex flex-wrap items-center gap-2">
        <select id="bible-book-select" class="min-h-11 min-w-[150px] flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3 text-sm text-white" aria-label="Livro bíblico"><option>Carregando livros...</option></select>
        <div class="relative min-w-[210px] flex-1">
          <i class="fas fa-search absolute left-3 top-3.5 text-xs text-slate-500"></i>
          <input id="bible-search-input" type="search" class="min-h-11 w-full rounded-xl border border-slate-700 bg-slate-950 pl-8 pr-3 text-sm text-white" placeholder="João 3:16 ou graça">
        </div>
        <button onclick="buscarBiblia()" class="min-h-11 rounded-xl bg-blue-600 px-4 text-white" aria-label="Buscar"><i class="fas fa-search"></i></button>
      </div>
      <div id="bible-chapter-selector" class="flex max-h-28 flex-wrap gap-1 overflow-y-auto" aria-label="Capítulos"></div>
    </section>

    <section id="bible-search-results" class="pergaminho hidden min-h-[55vh] rounded-2xl p-4 shadow-inner md:p-7">
      <div class="mb-4 flex items-start justify-between border-b border-amber-900/20 pb-4">
        <div><h2 id="bible-search-title" class="text-xl font-bold">Resultados</h2><p id="bible-search-count" class="text-sm text-amber-900/60"></p></div>
        <button onclick="voltarLeituraBiblia()" class="rounded-lg bg-amber-100 px-3 py-2 text-sm font-bold text-amber-900"><i class="fas fa-arrow-left"></i> Leitura</button>
      </div>
      <div id="bible-loading" class="hidden py-12 text-center text-amber-900">Buscando versículos...</div>
      <div id="bible-error" class="hidden py-12 text-center text-red-700"><p id="bible-error-text"></p></div>
      <div id="bible-empty" class="hidden py-12 text-center text-amber-900/60">Nenhum versículo encontrado.</div>
      <div id="bible-results" class="grid gap-3 md:grid-cols-2"></div>
    </section>

    <section id="bible-page" class="pergaminho relative min-h-[58vh] flex-1 rounded-2xl p-5 shadow-inner md:p-10">
      <header class="mb-5 border-b border-amber-900/20 pb-4 text-center">
        <h2 id="bible-current-book" class="font-serif text-2xl font-bold uppercase tracking-wide md:text-3xl">Bíblia Sagrada</h2>
        <p id="bible-current-chapter" class="mt-1 text-amber-900/70">Carregando...</p>
      </header>
      <div id="bible-verses-content"><p class="bible-empty-message">Preparando sua leitura...</p></div>
      <div id="bible-page-loading" class="absolute inset-0 hidden flex items-center justify-center rounded-2xl bg-[#fffaf0]/90 text-amber-900">Carregando capítulo...</div>
    </section>

    <nav class="flex items-center justify-between gap-3 pb-safe">
      <button onclick="capituloAnterior()" id="btn-capitulo-ant" class="min-h-11 rounded-xl bg-white/10 px-4 text-sm font-semibold text-white disabled:opacity-30"><i class="fas fa-chevron-left"></i> Anterior</button>
      <a href="index.html" class="min-h-11 rounded-xl bg-amber-500/15 px-4 py-3 text-sm font-semibold text-amber-200"><i class="fas fa-home"></i> Início</a>
      <button onclick="proximoCapitulo()" id="btn-capitulo-prox" class="min-h-11 rounded-xl bg-white/10 px-4 text-sm font-semibold text-white disabled:opacity-30">Próximo <i class="fas fa-chevron-right"></i></button>
    </nav>
  </main>
</body>
</html>
